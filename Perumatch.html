<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Próximos Partidos - Perú</title>
</head>
<body>
    <div id="fs-upcoming"></div>
    <script>
    (function(w, d, s, o, f, js, fjs) {
        w['fsUpcomingEmbed'] = o;
        w[o] = w[o] || function() { (w[o].q = w[o].q || []).push(arguments); };
        js = d.createElement(s);
        fjs = d.getElementsByTagName(s)[0];
        js.id = o;
        js.src = f;
        js.async = 1;
        fjs.parentNode.insertBefore(js, fjs);
    })(window, document, 'script', 'fsUpcoming', 'https://cdn.footystats.org/embeds/upcoming-loc.js'));

    fsUpcoming('params', { teamID: 8673, lang: 'es' });

    function ajustarHorario() {
        let elementosHora = document.querySelectorAll('[id*="fsUpcomingTime"], .fs-fixture-time, .match-time'); 
        let elementoFecha = document.querySelector('#fsUpcomingDate');

        elementosHora.forEach(element => {
            let horaTexto = element.textContent.trim().match(/\d{1,2}:\d{2}/); // Extraer la hora correctamente
            if (horaTexto) {
                let partesHora = horaTexto[0].split(':');
                let fecha = new Date();
                fecha.setUTCHours(parseInt(partesHora[0]), parseInt(partesHora[1]), 0);
                fecha.setHours(fecha.getHours() - 5); // Ajuste de GMT a Colombia (GMT-5)

                let opcionesHora = { hour: '2-digit', minute: '2-digit', hour12: true };
                element.textContent = new Intl.DateTimeFormat('es-CO', opcionesHora).format(fecha);
            }
        });

        // Ajustar la fecha si cambia por el huso horario
        if (elementoFecha && elementoFecha.textContent.trim() !== '') {
            let partesFecha = elementoFecha.textContent.match(/(\d{1,2})\/(\d{1,2}) (\w+)/); // Extraer fecha en formato "4/6 Wednesday"
            if (partesFecha) {
                let fecha = new Date();
                fecha.setUTCDate(parseInt(partesFecha[1]));
                fecha.setUTCMonth(parseInt(partesFecha[2]) - 1); // Mes en JavaScript empieza en 0
                fecha.setHours(fecha.getHours() - 5); // Ajuste de GMT a Colombia (GMT-5)

                let opcionesFecha = { day: '2-digit', month: 'short', year: 'numeric' };
                let nuevaFecha = new Intl.DateTimeFormat('es-CO', opcionesFecha).format(fecha);

                elementoFecha.textContent = nuevaFecha.replace('.', ''); // Eliminar punto en "jun." si lo hay
            }
        }
    }

    setTimeout(ajustarHorario, 3000);
    </script>
</body>
</html>
