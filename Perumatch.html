<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Próximos Partidos</title>
</head>
<body>
    <div id="fs-upcoming-col"></div>
    <div id="fs-upcoming-per"></div>

    <script>
    (function(w,d,s,o,f,js,fjs){
        w['fsUpcomingEmbed'] = o;
        w[o] = w[o] || function() { (w[o].q = w[o].q || []).push(arguments) };
        js = d.createElement(s);
        fjs = d.getElementsByTagName(s)[0];
        js.id = o;
        js.src = f;
        js.async = 1;
        fjs.parentNode.insertBefore(js, fjs);
    })(window, document, 'script', 'fsUpcoming', 'https://cdn.footystats.org/embeds/upcoming-loc.js');

    // Cargar partidos de Colombia
    fsUpcoming('params', { teamID: 8638, lang: 'es', containerID: 'fs-upcoming-col' });

    // Cargar partidos de Perú
    fsUpcoming('params', { teamID: 8673, lang: 'es', containerID: 'fs-upcoming-per' });

    window.onload = function() {
        setTimeout(function() {
            ajustarHora('#fs-upcoming-col');
            ajustarHora('#fs-upcoming-per');
        }, 2000);
    };

    function ajustarHora(selector) {
        const fechaElement = document.querySelector(`${selector} #fsUpcomingTime`);
        const fechaSpanElement = document.querySelector(`${selector} #fsUpcomingDate`);
        
        if (fechaElement) {
            let fechaGMT = fechaElement.textContent.trim().replace(' (GMT)', '');
            const fechaParts = fechaGMT.split(':');
            const now = new Date();
            now.setHours(fechaParts[0]);
            now.setMinutes(fechaParts[1]);
            now.setSeconds(0);
            now.setHours(now.getHours() - 5); // Ajuste a GMT-5

            if (!isNaN(now)) {
                const opciones = { hour: '2-digit', minute: '2-digit' };
                fechaElement.textContent = new Intl.DateTimeFormat('es-CO', opciones).format(now);
            }
        }

        if (fechaSpanElement) {
            let fechaGMT = fechaSpanElement.textContent.trim();
            const partesFecha = fechaGMT.split(' ');
            const fechaParts = partesFecha[0].split('/');
            const fecha = new Date();
            fecha.setDate(fechaParts[0]);
            fecha.setMonth(fechaParts[1] - 1);
            fecha.setFullYear(2025);
            fecha.setHours(fecha.getHours() - 5);

            if (!isNaN(fecha)) {
                const opcionesFecha = { day: '2-digit', month: 'short', year: 'numeric' };
                fechaSpanElement.textContent = new Intl.DateTimeFormat('es-CO', opcionesFecha).format(fecha);
            }
        }
    }
    </script>
</body>
</html>
