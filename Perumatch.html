<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Próximos Partidos - Perú</title>
</head>
<body>
    <div id="fs-upcoming"></div>
    <script>
    (function(w, d, s, o, f, js, fjs) {
        w['fsUpcomingEmbed'] = o;
        w[o] = w[o] || function() { (w[o].q = w[o].q || []).push(arguments); };
        js = d.createElement(s);
        fjs = d.getElementsByTagName(s)[0];
        js.id = o;
        js.src = f;
        js.async = 1;
        fjs.parentNode.insertBefore(js, fjs);
    })(window, document, 'script', 'fsUpcoming', 'https://cdn.footystats.org/embeds/upcoming-loc.js');

    fsUpcoming('params', { teamID: 8673, lang: 'es' });

   function ajustarFechaHora() {
    let elementosHora = document.querySelectorAll('[id*="fsUpcomingTime"], .fs-fixture-time, .match-time'); 
    let elementosFecha = document.querySelectorAll('[id*="fsUpcomingDate"], .fs-fixture-date'); 

    elementosHora.forEach(element => {
        let horaTexto = element.textContent.trim().match(/\d{1,2}:\d{2}/); 

        if (horaTexto) {
            let partesHora = horaTexto[0].split(':');
            let fecha = new Date();
            fecha.setUTCHours(parseInt(partesHora[0]), parseInt(partesHora[1]), 0);
            fecha.setHours(fecha.getHours() - 5); // Ajuste a Colombia (GMT-5)

            let opcionesHora = { hour: '2-digit', minute: '2-digit', hour12: true };
            element.textContent = new Intl.DateTimeFormat('es-CO', opcionesHora).format(fecha);
        }
    });

    elementosFecha.forEach(element => {
        let fechaTexto = element.textContent.trim().match(/\d{1,2}\/\d{1,2}/); 

        if (fechaTexto) {
            let partesFecha = fechaTexto[0].split('/');
            let fecha = new Date();
            fecha.setUTCDate(parseInt(partesFecha[0]));
            fecha.setUTCMonth(parseInt(partesFecha[1]) - 1);
            fecha.setHours(fecha.getHours() - 5); // Ajuste de zona horaria

            let opcionesFecha = { day: '2-digit', month: 'long', year: 'numeric' };
            element.textContent = new Intl.DateTimeFormat('es-CO', opcionesFecha).format(fecha);
        }
    });
}

    setTimeout(ajustarHorario, 3000);
    </script>
</body>
</html>
