<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Próximos Partidos - Perú</title>
</head>
<body>
    <div id="fs-upcoming"></div>
    <script>
    (function(w, d, s, o, f, js, fjs) {
        w['fsUpcomingEmbed'] = o;
        w[o] = w[o] || function() { (w[o].q = w[o].q || []).push(arguments); };
        js = d.createElement(s);
        fjs = d.getElementsByTagName(s)[0];
        js.id = o;
        js.src = f;
        js.async = 1;
        fjs.parentNode.insertBefore(js, fjs);
    })(window, document, 'script', 'fsUpcoming', 'https://cdn.footystats.org/embeds/upcoming-loc.js');

    fsUpcoming('params', { teamID: 8673, lang: 'es' });

    function ajustarHorario() {
        let elementosHora = document.querySelectorAll('[id*="fsUpcomingTime"], .fs-fixture-time, .match-time'); 
        let elementoFecha = document.querySelector('#fsUpcomingDate');

        if (elementoFecha && elementoFecha.textContent.trim() !== '') {
            let partesFecha = elementoFecha.textContent.match(/(\d{1,2})\/(\d{1,2})/); // Extraer día y mes "4/6"
            if (partesFecha) {
                let fecha = new Date(Date.UTC(2025, parseInt(partesFecha[2]) - 1, parseInt(partesFecha[1])));

                // Ajustar la fecha según la zona horaria de Colombia
                fecha.setUTCHours(fecha.getUTCHours() - 5);

                let opcionesFecha = { day: '2-digit', month: 'long', year: 'numeric', timeZone: 'America/Bogota' };
                elementoFecha.textContent = new Intl.DateTimeFormat('es-CO', opcionesFecha).format(fecha);
            }
        }

        elementosHora.forEach(element => {
            let horaTexto = element.textContent.trim().match(/\d{1,2}:\d{2}/); // Extraer la hora correctamente
            if (horaTexto) {
                let partesHora = horaTexto[0].split(':');
                let fecha = new Date();
                fecha.setUTCHours(parseInt(partesHora[0]), parseInt(partesHora[1]), 0);

                // Ajustar la hora según la zona horaria de Colombia
                fecha.setHours(fecha.getHours() - 5);

                let opcionesHora = { hour: '2-digit', minute: '2-digit', hour12: true, timeZone: 'America/Bogota' };
                element.textContent = new Intl.DateTimeFormat('es-CO', opcionesHora).format(fecha);
            }
        });
    }

    setTimeout(ajustarHorario, 3000);
    </script>
</body>
</html>
