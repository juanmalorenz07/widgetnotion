<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Próximos Partidos - Perú</title>
</head>
<body>
    <div id="fs-upcoming"></div>
    <script>
    (function(w, d, s, o, f, js, fjs) {
        w['fsUpcomingEmbed'] = o;
        w[o] = w[o] || function() { (w[o].q = w[o].q || []).push(arguments); };
        js = d.createElement(s);
        fjs = d.getElementsByTagName(s)[0];
        js.id = o;
        js.src = f;
        js.async = 1;
        fjs.parentNode.insertBefore(js, fjs);
    })(window, document, 'script', 'fsUpcoming', 'https://cdn.footystats.org/embeds/upcoming-loc.js'));

    fsUpcoming('params', { teamID: 8673, lang: 'es' });

    function ajustarHorario() {
        let elementosHora = document.querySelectorAll('[id*="fsUpcomingTime"], .fs-fixture-time, .match-time'); 

        elementosHora.forEach(element => {
            let textoOriginal = element.textContent.trim();
            let fechaHoraTexto = textoOriginal.match(/\d{1,2}:\d{2}/); // Extraer hora
            let fechaTexto = textoOriginal.match(/\d{1,2}\/\d{1,2}\/\d{4}/); // Extraer fecha si está presente

            if (fechaHoraTexto) {
                let partesHora = fechaHoraTexto[0].split(':');
                let fecha = new Date();

                if (fechaTexto) {
                    let partesFecha = fechaTexto[0].split('/');
                    fecha.setUTCFullYear(parseInt(partesFecha[2]), parseInt(partesFecha[1]) - 1, parseInt(partesFecha[0]));
                }

                fecha.setUTCHours(parseInt(partesHora[0]), parseInt(partesHora[1]), 0);
                
                // Convertir de UTC a Colombia (GMT-5)
                fecha.setMinutes(fecha.getMinutes() - (5 * 60));

                // Formato Colombia: "Día Mes Año - HH:mm (hora de Colombia)"
                let opcionesFecha = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
                let opcionesHora = { hour: '2-digit', minute: '2-digit', hour12: false };

                let fechaFormateada = new Intl.DateTimeFormat('es-CO', opcionesFecha).format(fecha);
                let horaFormateada = new Intl.DateTimeFormat('es-CO', opcionesHora).format(fecha);

                element.textContent = `${fechaFormateada} - ${horaFormateada} (hora de Colombia)`;
            }
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        setTimeout(ajustarHorario, 3000);
    });
    </script>
</body>
</html>
